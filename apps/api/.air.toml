root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/api ./cmd/api"
bin = "./tmp/api"
delay = 200
exclude_dir = ["tmp", "docker", "migrations", "queries"]
include_ext = ["go"]
exclude_regex = ["_test\\.go"]
stop_on_error = true
send_interrupt = true

[log]
time = false

[misc]
clean_on_exit = true
